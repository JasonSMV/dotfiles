general:
  # Commands to run when the WM has started. This is useful for running a
  # script or launching another application.
  # Example: The below command launches Zebar.
  startup_commands: ["shell-exec gat-gwm", "focus --workspace 1"]
  shutdown_commands: ["shell-exec taskkill /IM gat-gwm.exe /F"]

  # Commands to run after the WM config is reloaded.
  config_reload_commands: ["focus --workspace 2"]

  # Whether to automatically focus windows underneath the cursor.
  focus_follows_cursor: true

  # Whether to switch back and forth between the previously focused
  # workspace when focusing the current workspace.
  toggle_workspace_on_refocus: false

  cursor_jump:
    # Whether to automatically move the cursor on the specified trigger.
    enabled: true

    # Trigger for cursor jump:
    # - 'monitor_focus': Jump when focus changes between monitors.
    # - 'window_focus': Jump when focus changes between windows.
    trigger: "window_focus"

  # How windows should be hidden when switching workspaces.
  # - 'cloak': Recommended. Hides windows with no animation.
  # - 'hide': Legacy method (v3.5 and earlier) that has a brief animation,
  # but has stability issues with some apps.
  hide_method: "cloak"

  # Affects which windows get shown in the native Windows taskbar. Has no
  # effect if `hide_method: 'hide'`.
  # - 'true': Show all windows (regardless of workspace).
  # - 'false': Only show windows from the currently shown workspaces.
  show_all_in_taskbar: false

gaps:
  # Whether to scale the gaps with the DPI of the monitor.
  scale_with_dpi: true

  # Gap between adjacent windows.
  inner_gap: "7px"

  # Gap between windows and the screen edge.
  outer_gap:
    top: "3px"
    right: "3px"
    bottom: "3px"
    left: "3px"

window_effects:
  # Visual effects to apply to the focused window.
  focused_window:
    # Highlight the window with a colored border.
    # ** Exclusive to Windows 11 due to API limitations.
    border:
      enabled: true
      color: "#88b3fa"

    # Remove the title bar from the window's frame. Note that this can
    # cause rendering issues for some applications.
    hide_title_bar:
      enabled: false

    # Change the corner style of the window's frame.
    # ** Exclusive to Windows 11 due to API limitations.
    corner_style:
      enabled: true
      # Allowed values: 'square', 'rounded', 'small_rounded'.
      style: "square"

    # Change the transparency of the window.
    transparency:
      enabled: true
      # Can be something like '95%' or '0.95' for slightly transparent windows.
      # '0' or '0%' is fully transparent (and, by consequence, unfocusable).
      opacity: "97%"

  # Visual effects to apply to non-focused windows.
  other_windows:
    border:
      enabled: true
      color: "#808080"
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: true
      style: "square"
    transparency:
      enabled: true
      opacity: "93%"

window_behavior:
  # New windows are created in this state whenever possible.
  # Allowed values: 'tiling', 'floating'.
  initial_state: "tiling"

  # Sets the default options for when a new window is created. This also
  # changes the defaults for when the state change commands, like
  # `set-floating`, are used without any flags.
  state_defaults:
    floating:
      # Whether to center floating windows by default.
      centered: false

      # Whether to show floating windows as always on top.
      shown_on_top: true

    fullscreen:
      # Maximize the window if possible. If the window doesn't have a
      # maximize button, then it'll be fullscreen'ed normally instead.
      maximized: false

      # Whether to show fullscreen windows as always on top.
      shown_on_top: false

# Pin everything to your main monitor
workspaces:
  - name: "1"
    display_name: "1. Chats"
    bind_to_monitor: 0
    keep_alive: true
  - name: "2"
    display_name: "2. Browser"
    bind_to_monitor: 1
    keep_alive: true
  - name: "3"
    display_name: "3. Code"
    bind_to_monitor: 1
    keep_alive: true
  - name: "4"
    display_name: "4. Tools"
    bind_to_monitor: 1
    keep_alive: true
  - name: "5"
    bind_to_monitor: 1
    keep_alive: true
  - name: "6"
    bind_to_monitor: 1
  - name: "7"
    bind_to_monitor: 1
  - name: "8"
    bind_to_monitor: 1
  - name: "9"
    bind_to_monitor: 0

window_rules:
  - commands: ["ignore"]
    match:
      # Ignore rules for Window Manager apps
      - window_process: { equals: "zebar" }
      - window_process: { equals: "yasb" }
      - window_process: { equals: "LiveCaptions" }

      # Ignores picture-in-picture windows for browsers.
      - window_title: { regex: "[Pp]icture.in.[Pp]icture" }
        window_class: { regex: "Chrome_WidgetWin_1|MozillaDialogClass" }

      # Ignore rules for various 3rd-party apps.
      - window_process: { equals: "PowerToys" }
        window_class: { regex: 'HwndWrapper\[PowerToys\.PowerAccent.*?\]' }
      - window_process: { equals: "PowerToys" }
        window_title: { regex: ".*? - Peek" }
      - window_process: { equals: "Lively" }
        window_class: { regex: "HwndWrapper" }
      - window_process: { equals: "EXCEL" }
        window_class: { not_regex: "XLMAIN" }
      - window_process: { equals: "WINWORD" }
        window_class: { not_regex: "OpusApp" }
      - window_process: { equals: "POWERPNT" }
        window_class: { not_regex: "PPTFrameClass" }

      # Ignores Screenshot Apps (tend to cause issue with Tiling Manager, ShareX doesn't smh. I don't understand how the f apps work, it is what it is)
      - window_process: { equals: "Lightshot" }
      - window_process: { equals: "Greenshot" }
      - window_process: { equals: "ShareX" }
        window_title: { regex: "Region capture" }

  - commands: ["set-floating"]
    match:
      # Essential popups for C#/.NET development workflows
      # Visual studio
      - window_process: { equals: "devenv" }
        window_title:
          {
            regex: "(Rename|Find and Replace|Search|Attach|Find|Debugger|Replace)",
          }
      # Float rider popups
      - window_process: { equals: "rider64" }
        window_title:
          {
            regex: "(Search|Find|Attach|Debugger|Run/Debug|Replace|Rename|dotPeek64|Checkout|Conflicts|Merge|Commit|Create)",
          }

        # handle ssms sql server
      - window_process: { equals: "SSMS" }
        window_title: { not_regex: "Microsoft SQL Server Management Studio" }

      - window_process: { equals: "obs64" }
        window_title: { not_regex: "OBS" }

      # Float common Windows save/open dialogs
      - window_process: { equals: "rundll32" }
        window_title: { equals: "Properties" }

      - window_process: { regex: "Autoruns" }

      - window_process:
          {
            regex: "[Ww]in[Ss]py|explorer|qbittorrent|mmc|nvcplui|mpv|vlc|efibooteditor|[Mm]ac[Tt]ray|sine",
          }
      - window_process: { equals: "speedcrunch" }
      - window_process: { equals: "winspy" }
      - window_process: { equals: "localsend_app" }
      # Cisco vpn app
      - window_process: { equals: "csc_ui" }

      - window_title: { equals: "Snipping Tool" }
      - window_title: { equals: "Windhawk" }

      # Visual Studio
      - window_title: { includes: "FLOAT" }
      - window_process: { equals: "devenv" } # Float the VS Rename dialog
        window_title: { equals: "Rename" }
      - window_process: { equals: "devenv" } # Float the VS Find and Replace dialog
        window_title: { equals: "Find and Replace" }
      - window_process: { equals: "devenv" } # Float the VS Search
        window_title: { equals: "Search" }

      # Jetbrains dotPeek
      - window_process: { equals: "dotPeek64" }
        window_title: { not_regex: "JetBrains" }

      # System Apps
      - window_title: { equals: "Task Manager" }
      - window_process: { equals: "Taskmgr" }
      - window_title: { equals: "App Installer" }
      - window_title: { equals: "Settings" } # Change to SystemSettings
      - window_process: { regex: "cmd" }
      - window_process: { regex: "regedit" }
      - window_process: { equals: "mspaint" }

    # Keeping this for reference in the future, I duno use this tho.
  - commands: ["set-floating --centered"]
    match:
      - window_title: { regex: "Volume Mixer" }
      - window_process: { equals: "EarTrumpet" }
      - window_title: { regex: "(Find|Replace)" }

    # Start apps in their own workspaces

  - commands: ["move --workspace 1", "focus --workspace 1"]
    match:
      - window_process: { regex: "ms-teams" }
      - window_process: { regex: "Notion" }
      - window_title: { regex: "Outlook" }

  - commands: ["move --workspace 2", "focus --workspace 2"]
    match:
      - window_process: { regex: "librewolf|firefox|chrome|brave" }

  - commands: ["move --workspace 3", "focus --workspace 3"]
    match:
      - window_process: { regex: "rider64|devenv|Cursor" }

  - commands: ["move --workspace 4", "focus --workspace 4"]
    match:
      - window_process: { regex: "SSMS|Postman|Docker" }

  - commands: ["move --workspace 9", "focus --workspace 9"]
    match:
      - window_process: { regex: "obs64" }

binding_modes:
  # When enabled, the focused window can be resized via arrow keys or HJKL.
  - name: "resize"
    keybindings:
      - commands: ["resize --width -2%"]
        bindings: ["h", "left"]
      - commands: ["resize --width +2%"]
        bindings: ["l", "right"]
      - commands: ["resize --height +2%"]
        bindings: ["k", "up"]
      - commands: ["resize --height -2%"]
        bindings: ["j", "down"]
      # Press enter/escape to return to default keybindings.
      - commands: ["wm-disable-binding-mode --name resize"]
        bindings: ["escape", "enter"]

  - name: "pause"
    keybindings:
      - commands: ["wm-disable-binding-mode --name pause"]
        bindings: ["f13+shift+z"]

keybindings:
  # Shift focus in a given direction.
  - commands: ["focus --direction left"]
    bindings: ["f13+h", "f13+left"]
  - commands: ["focus --direction right"]
    bindings: ["f13+l", "f13+right"]
  - commands: ["focus --direction up"]
    bindings: ["f13+k", "f13+up"]
  - commands: ["focus --direction down"]
    bindings: ["f13+j", "f13+down"]

  # Move focused window in a given direction.
  - commands: ["move --direction left"]
    bindings: ["f13+shift+h", "f13+shift+left"]
  - commands: ["move --direction right"]
    bindings: ["f13+shift+l", "f13+shift+right"]
  - commands: ["move --direction up"]
    bindings: ["f13+shift+k", "f13+shift+up"]
  - commands: ["move --direction down"]
    bindings: ["f13+shift+j", "f13+shift+down"]

  # Resize focused window by a percentage or pixel amount.

  # Grow/shrink width
  - commands: ["resize --width +2%"]
    bindings: ["f13+oem_plus"]
  - commands: ["resize --width -2%"]
    bindings: ["f13+oem_minus"]

  # Grow/shrink height
  - commands: ["resize --height +2%"]
    bindings: ["f13+shift+oem_plus"]
  - commands: ["resize --height -2%"]
    bindings: ["f13+shift+oem_minus"]

  # As an f13ernative to the resize keybindings above, resize mode enables
  # resizing via arrow keys or HJKL. The binding mode is defined above with
  # the name 'resize'.
  - commands: ["wm-enable-binding-mode --name resize"]
    bindings: ["f13+r"]

  # Disables window management and all other keybindings until f13+shift+p
  # is pressed again.
  - commands: ["wm-toggle-pause"]
    bindings: ["f13+shift+z"]

  # Change tiling direction. This determines where new tiling windows will
  # be inserted.
  - commands: ["toggle-tiling-direction"]
    bindings: ["f13+v"]

  # Change focus from tiling windows -> floating -> fullscreen.
  - commands: ["wm-cycle-focus"]
    bindings: ["f13+space"]

  # Change the focused window to be floating.
  - commands: ["toggle-floating --centered"]
    bindings: ["f13+shift+space"]

  # Change the focused window to be tiling.
  - commands: ["toggle-tiling"]
    bindings: ["f13+t"]

  # Change the focused window to be fullscreen.
  - commands: ["toggle-fullscreen"]
    bindings: ["f13+f"]

  # Minimize focused window.
  - commands: ["toggle-minimized"]
    bindings: ["f13+m"]

  # Close focused window.
  - commands: ["close"]
    bindings: ["f13+q"]

  # Kill GlazeWM process safely.
  - commands: ["wm-exit"]
    bindings: ["f13+shift+e"]

  # Re-evaluate configuration file.
  - commands: ["wm-reload-config"]
    bindings: ["f13+shift+r"]

  # Redraw all windows.
  - commands: ["wm-redraw"]
    bindings: ["f13+shift+w"]

  # Apps

  # Launch CMD terminal. f13ernatively, use `shell-exec wt` or
  # `shell-exec %ProgramFiles%/Git/git-bash.exe` to start Windows
  # Terminal and Git Bash respectively.
  - commands: ["shell-exec wt"]
    bindings: ["f13+enter"]

  # Open Flow Launcher
  - commands:
      [
        'shell-exec C:\\Users\\devje\\AppData\\Local\\FlowLauncher\\Flow.Launcher.exe',
      ]
    bindings: ["f13+d"]

  #Browser
  - commands: ["shell-exec brave"]
    bindings: ["f13+b"]

  # File explorer
  - commands: ["shell-exec explorer"]
    bindings: ["f13+shift+f"]

  # Lock computer
  - commands: ["shell-exec rundll32.exe user32.dll,LockWorkStation"]
    bindings: ["f13+ctrl+l"]

  # Focus the next/previous active workspace defined in `workspaces` config.
  - commands: ["focus --next-active-workspace"]
    bindings: ["f13+s", "f13+tab"]
  - commands: ["focus --prev-active-workspace"]
    bindings: ["f13+a", "f13+shift+tab"]

  # Focus the workspace that last had focus.
  - commands: ["focus --recent-workspace"]
    bindings: ["f13+ctrl+tab"]

  # Change focus to a workspace defined in `workspaces` config.
  - commands: ["focus --workspace 1"]
    bindings: ["f13+1"]
  - commands: ["focus --workspace 2"]
    bindings: ["f13+2"]
  - commands: ["focus --workspace 3"]
    bindings: ["f13+3"]
  - commands: ["focus --workspace 4"]
    bindings: ["f13+4"]
  - commands: ["focus --workspace 5"]
    bindings: ["f13+5"]
  - commands: ["focus --workspace 6"]
    bindings: ["f13+6"]
  - commands: ["focus --workspace 7"]
    bindings: ["f13+7"]
  - commands: ["focus --workspace 8"]
    bindings: ["f13+8"]
  - commands: ["focus --workspace 9"]
    bindings: ["f13+9"]

  # Move the focused window's parent workspace to a monitor in a given direction.
  - commands: ["move-workspace --direction left"]
    bindings: ["f13+shift+ctrl+left", "f13+shift+ctrl+h"]
  - commands: ["move-workspace --direction right"]
    bindings: ["f13+shift+ctrl+right", "f13+shift+ctrl+l"]
  - commands: ["move-workspace --direction up"]
    #bindings: ['f13+shift+d']
  - commands: ["move-workspace --direction down"]
    #bindings: ['f13+shift+s']

  # Move focused window to a workspace defined in `workspaces` config.
  - commands: ["move --workspace 1", "focus --workspace 1"]
    bindings: ["f13+shift+1"]
  - commands: ["move --workspace 2", "focus --workspace 2"]
    bindings: ["f13+shift+2"]
  - commands: ["move --workspace 3", "focus --workspace 3"]
    bindings: ["f13+shift+3"]
  - commands: ["move --workspace 4", "focus --workspace 4"]
    bindings: ["f13+shift+4"]
  - commands: ["move --workspace 5", "focus --workspace 5"]
    bindings: ["f13+shift+5"]
  - commands: ["move --workspace 6", "focus --workspace 6"]
    bindings: ["f13+shift+6"]
  - commands: ["move --workspace 7", "focus --workspace 7"]
    bindings: ["f13+shift+7"]
  - commands: ["move --workspace 8", "focus --workspace 8"]
    bindings: ["f13+shift+8"]
  - commands: ["move --workspace 9", "focus --workspace 9"]
    bindings: ["f13+shift+9"]
